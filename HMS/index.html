<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hospital Management System - Professional Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <img src="photo.png" alt="Logo" class="logo">
        <div class="header-info">
          <h1>KALAWATI HOSPITAL</h1>
          <p class="subtitle">Advanced Hospital Management System</p>
        </div>
      </div>
      <div class="header-right">
        <div class="user-info">
          <i class="fas fa-user-circle"></i>
          <span>Admin User Dashboard</span>
        </div>
        <div class="date-time">
          <i class="fas fa-calendar"></i>
          <span id="currentDate"></span>
          <i class="fas fa-clock"></i>
          <span id="currentTime"></span>
        </div>
      </div>
    </header>

    <nav class="main-nav">
      <div class="nav-container">
        <button class="nav-btn active" data-page="dashboard">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </button>
        <button class="nav-btn" data-page="patients">
          <i class="fas fa-users"></i>
          <span>Patients</span>
        </button>
        <button class="nav-btn" data-page="admissions">
          <i class="fas fa-hospital"></i>
          <span>Admissions</span>
        </button>
        <button class="nav-btn" data-page="vitals">
          <i class="fas fa-heartbeat"></i>
          <span>Vitals</span>
        </button>
        <button class="nav-btn" data-page="symptoms">
          <i class="fas fa-stethoscope"></i>
          <span>Symptoms</span>
        </button>
        <button class="nav-btn" data-page="meds">
          <i class="fas fa-pills"></i>
          <span>Medications</span>
        </button>
        <button class="nav-btn" data-page="appts">
          <i class="fas fa-calendar-check"></i>
          <span>Appointments</span>
        </button>
        <button class="nav-btn" data-page="inventory">
          <i class="fas fa-boxes"></i>
          <span>Inventory</span>
        </button>
        <button class="nav-btn" data-page="billing">
          <i class="fas fa-file-invoice-dollar"></i>
          <span>Billing</span>
        </button>
        <button class="nav-btn" data-page="reports">
          <i class="fas fa-chart-bar"></i>
          <span>Reports</span>
        </button>
        <button class="nav-btn" data-page="ai-reports">
          <i class="fas fa-brain"></i>
          <span>AI Health Reports</span>
        </button>
      </div>
    </nav>

    <main id="main">
      <!-- Content will be loaded dynamically by app.js -->
    </main>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-left">
          <p>&copy; 2025 KALAWATI HOSPITAL . </p>
          <p class="slogan">Your Health Our Vision...</p>
        </div>
        <div class="footer-right">
          <div class="footer-links">
            <a href="#" class="footer-link">Privacy Policy</a>
            <a href="#" class="footer-link">Terms of Service</a>
            <a href="mailto:kalawatihms1@gmail.com" class="footer-link">Support</a>
          </div>
          <div class="system-status">
            <span class="status-indicator online"></span>
            <a href="tel:+917970880676" class="footer-link">System Online</a>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    // Update date and time
    function updateDateTime() {
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString();
      document.getElementById('currentTime').textContent = now.toLocaleTimeString();
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>
</html>
